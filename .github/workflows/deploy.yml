# Deploys the site to Cloudflare Pages: https://baxodirzoda.pages.dev
#
# One-time setup (GitHub → this repo → Settings → Secrets and variables →
# Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token with "Account · Cloudflare Pages · Edit"
#                          and "Account · Account Settings · Read"
#   CLOUDFLARE_ACCOUNT_ID  Optional. Without it the account is looked up from the token.
#
# After that, every push to the branches below publishes the site.
# It can also be started by hand: Actions → "Deploy to Cloudflare Pages" → Run workflow.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, claude/lucid-hypatia-9mv9z8]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROJECT_NAME: baxodirzoda
  WRANGLER_VERSION: 4.135.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets are read under other names; the step below cleans them up and
      # exports CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID for wrangler.
      TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$TOKEN_SECRET" ]; then
            echo "::notice::Skipping deploy: add the CLOUDFLARE_API_TOKEN repository secret first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Cloudflare credentials
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # Fix common paste mistakes: spaces or new lines around the token, a
          # "Bearer " prefix, or the whole "curl ... Bearer <token>" test command.
          token=$(printf '%s' "$TOKEN_SECRET" | tr -d '\r')
          if printf '%s' "$token" | grep -q 'Bearer'; then
            token=$(printf '%s' "$token" | sed -n 's/.*Bearer[[:space:]]\{1,\}\([A-Za-z0-9._~+/=-]\{1,\}\).*/\1/p' | head -n 1)
          fi
          token=$(printf '%s' "$token" | tr -d '[:space:]')
          if [ -z "$token" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret does not contain a token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "Token: ${#token} characters (secret was ${#TOKEN_SECRET})."

          verify=$(curl -sS -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/user/tokens/verify" || true)
          echo "Token check: $(echo "$verify" | jq -c '{success, status: .result.status, errors}' 2>/dev/null || echo 'no JSON response')"

          account_id=$(printf '%s' "$ACCOUNT_ID_SECRET" | tr -d '[:space:]')
          if [ -z "$account_id" ]; then
            response=$(curl -sS -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/accounts?per_page=50" || true)
            account_id=$(echo "$response" | jq -r '.result[0].id // empty' 2>/dev/null || true)
            count=$(echo "$response" | jq -r '.result | length? // 0' 2>/dev/null || echo 0)
            if [ -z "$account_id" ]; then
              echo "::error::Could not look up the Cloudflare account from the token. Give the token 'Account Settings: Read' as well, or add the CLOUDFLARE_ACCOUNT_ID secret."
              echo "$response" | jq -c '.errors // .' 2>/dev/null || true
              exit 1
            fi
            if [ "$count" -gt 1 ]; then
              echo "::warning::The token can see $count accounts; using the first one. Add the CLOUDFLARE_ACCOUNT_ID secret to choose another."
            fi
            echo "Using account: $(echo "$response" | jq -r '.result[0].name')"
          fi

          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Collect site files
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude README.md ./ "$RUNNER_TEMP/site/"
          ls -la "$RUNNER_TEMP/site"

      - name: Create the Pages project (first run only)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if npx --yes "wrangler@$WRANGLER_VERSION" pages project list | grep -qw "$PROJECT_NAME"; then
            echo "Project $PROJECT_NAME already exists."
          else
            npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PROJECT_NAME" --production-branch main
          fi

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy "$RUNNER_TEMP/site" \
            --project-name "$PROJECT_NAME" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(git log -1 --pretty=%s)"
