# Deploys the site to Cloudflare Pages: https://baxodirzoda.pages.dev
#
# One-time setup (GitHub → this repo → Settings → Secrets and variables →
# Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token with "Account · Cloudflare Pages · Edit"
#   CLOUDFLARE_ACCOUNT_ID  Your Cloudflare account ID
#
# After that, every push to the branches below publishes the site.
# It can also be started by hand: Actions → "Deploy to Cloudflare Pages" → Run workflow.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, claude/lucid-hypatia-9mv9z8]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROJECT_NAME: baxodirzoda
  WRANGLER_VERSION: 4.135.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping deploy: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Collect site files
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude README.md ./ "$RUNNER_TEMP/site/"
          ls -la "$RUNNER_TEMP/site"

      - name: Create the Pages project (first run only)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if npx --yes "wrangler@$WRANGLER_VERSION" pages project list | grep -qw "$PROJECT_NAME"; then
            echo "Project $PROJECT_NAME already exists."
          else
            npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PROJECT_NAME" --production-branch main
          fi

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy "$RUNNER_TEMP/site" \
            --project-name "$PROJECT_NAME" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(git log -1 --pretty=%s)"
